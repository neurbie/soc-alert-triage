[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "alerttriage"
version = "1.0.0"
description = "Deduplicate, score and rank security alerts into a Markdown SOC triage queue."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
alerttriage = "alerttriage.cli:main"

[tool.setuptools]
packages = ["alerttriage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
